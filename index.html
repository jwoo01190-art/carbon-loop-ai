<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07130f" />
<title>카본루프 · Carbon Loop</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" />
<style>
/* Carbon Loop — 디자인 토큰 & 스타일 (Tailwind 테마로 옮길 값) */
:root, [data-theme="dark"] {
  --bg: #07130f; --surface: #0e211b; --surface2: #13302a; --line: #1c3b33; --line2: #24493f;
  --text: #e8f5ef; --muted: #86a89b; --mint: #5eeabe; --on-mint: #05241b; --deep: #0b3b2e;
  --ok: #4fdc9b; --warn: #f2c14e; --danger: #ff6b5e; --info: #6cc6ff;
  --c-gh: #5eeabe; --c-mu: #f2c14e; --c-bc: #b88b62;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 30px rgba(0,0,0,.25);
  --sans: "Pretendard Variable", Pretendard, "Noto Sans KR", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
[data-theme="light"] {
  --bg: #eef3f0; --surface: #ffffff; --surface2: #eaf2ee; --line: #dbe6e1; --line2: #c9dad2;
  --text: #0c2a21; --muted: #5d7a70; --mint: #0f9f75; --on-mint: #ffffff; --deep: #0b3b2e;
  --ok: #129b62; --warn: #c58a06; --danger: #d9412f; --info: #1f7fc4;
  --c-gh: #16b083; --c-mu: #e0a615; --c-bc: #9a6d45;
  --shadow: 0 1px 2px rgba(12,42,33,.05), 0 6px 20px rgba(12,42,33,.05);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
body { font-size: 14px; line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; }
input { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.t-ok { color: var(--ok) !important; } .t-warn { color: var(--warn) !important; } .t-danger { color: var(--danger) !important; }

/* ---------- 레이아웃 ---------- */
.app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 22px; background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; cursor: pointer; }
.brand b, .splash-brand b { display: block; font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
.brand span, .splash-brand span { display: block; font: 600 10px var(--mono); letter-spacing: .18em; color: var(--muted); }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.side nav button { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; border: 0; background: none; color: var(--muted); font-weight: 600; text-align: left; position: relative; }
.side nav button:hover { background: var(--surface2); color: var(--text); }
.side nav button.on { background: var(--surface2); color: var(--mint); }
.side nav .dotn { margin-left: auto; }
.side-f { margin-top: auto; padding: 12px; border-radius: 12px; background: var(--surface2); display: grid; gap: 4px; }
.site { display: flex; gap: 6px; align-items: center; font-weight: 600; font-size: 13px; }
.side-src { font-size: 11px; color: var(--muted); }
.main { min-width: 0; padding: 0 28px; }
.top { position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; padding: 18px 0 14px; background: linear-gradient(var(--bg) 75%, transparent); }
.top-l { display: flex; gap: 10px; align-items: center; }
.top h1 { font-size: 22px; font-weight: 800; letter-spacing: -.03em; }
.top-sub { font-size: 11.5px; color: var(--muted); }
.top-r { display: flex; gap: 8px; align-items: center; }
.m-logo, .m-only { display: none !important; }
.live { display: inline-flex; gap: 7px; align-items: center; font-size: 12px; font-weight: 600; padding: 6px 11px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); }
.live i { width: 7px; height: 7px; border-radius: 9px; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: ping 1.6s infinite; }
.live.off i { background: var(--danger); animation: none; } .live.off { color: var(--danger); }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--ok) 60%, transparent); } 100% { box-shadow: 0 0 0 8px transparent; } }
.icon-btn { position: relative; width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
.dotn { position: absolute; top: -4px; right: -4px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--danger); color: #fff; font: 700 10px/17px var(--mono); font-style: normal; text-align: center; }
.side nav .dotn { position: static; }
.screen { display: grid; gap: 16px; padding-bottom: 20px; max-width: 1180px; animation: fade .3s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } }
.foot-sp { height: 40px; }
.tabbar { display: none; }

/* ---------- 카드 · 프리미티브 ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card-h h3 { font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
.card-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.col { display: grid; gap: 16px; align-content: start; min-width: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.grid-home { display: grid; grid-template-columns: minmax(300px, 1.05fr) 1fr; gap: 16px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.grid-4 > .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.stat-l { font-size: 12px; color: var(--muted); font-weight: 500; }
.stat-v { font: 700 28px/1.15 var(--mono); letter-spacing: -.03em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat.sm .stat-v { font-size: 20px; }
.unit { font: 500 13px var(--sans); color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.bdot { width: 6px; height: 6px; border-radius: 6px; background: currentColor; }
.b-ok { background: color-mix(in oklab, var(--ok) 16%, transparent); color: var(--ok); }
.b-warn { background: color-mix(in oklab, var(--warn) 18%, transparent); color: var(--warn); }
.b-danger { background: color-mix(in oklab, var(--danger) 18%, transparent); color: var(--danger); }
.b-info { background: color-mix(in oklab, var(--info) 16%, transparent); color: var(--info); }
.b-mute { background: var(--surface2); color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line2); background: var(--surface2); font-weight: 700; }
.btn:hover { border-color: var(--mint); }
.btn.primary { background: var(--mint); color: var(--on-mint); border-color: var(--mint); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 11px; font-size: 12.5px; border-radius: 9px; }
.btn.lg { padding: 14px 24px; font-size: 15px; border-radius: 14px; }
.btn.full { width: 100%; }
.seg { display: inline-flex; background: var(--surface2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.tgl { width: 46px; height: 27px; border-radius: 30px; border: 0; background: var(--line2); position: relative; transition: .2s; flex: none; }
.tgl i { position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 20px; background: #fff; transition: .2s; }
.tgl.on { background: var(--mint); } .tgl.on i { left: 22px; }
.tgl:disabled { opacity: .45; cursor: not-allowed; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11.5px; color: var(--muted); margin-top: 8px; justify-content: center; }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i.dash { height: 0; border-top: 2px dashed var(--mint); border-radius: 0; width: 14px; }
.empty { padding: 22px; text-align: center; color: var(--muted); font-size: 13px; border: 1px dashed var(--line2); border-radius: 12px; }
.note { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.55; text-wrap: pretty; }
.ph { height: 180px; display: grid; place-items: center; color: var(--muted); }
.ctip { background: var(--surface); border: 1px solid var(--line2); border-radius: 10px; padding: 8px 10px; font-size: 12px; box-shadow: var(--shadow); }
.ctip-t { font: 600 11px var(--mono); color: var(--muted); margin-bottom: 4px; }
.ctip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.ctip b { font-family: var(--mono); }

/* ---------- AI 판단 카드 ---------- */
.ai-card { --lv: var(--ok); position: relative; overflow: hidden; border-radius: 20px; padding: 20px 22px; background: linear-gradient(135deg, var(--deep), color-mix(in oklab, var(--deep) 80%, #000)); color: #eafff6; border: 1px solid color-mix(in oklab, var(--lv) 40%, transparent); }
.ai-card.lv-warn { --lv: var(--warn); } .ai-card.lv-danger { --lv: var(--danger); background: linear-gradient(135deg, #4a1712, #2a0d0a); } .ai-card.lv-info { --lv: var(--info); }
.ai-card::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; border: 22px solid color-mix(in oklab, var(--lv) 22%, transparent); }
.ai-top { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1; }
.ai-tag { display: inline-flex; gap: 8px; align-items: center; font: 700 12px var(--sans); letter-spacing: .02em; color: var(--lv); }
.pulse { width: 8px; height: 8px; border-radius: 8px; background: var(--lv); animation: ping2 1.4s infinite; }
@keyframes ping2 { 0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--lv) 70%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
.ai-mode { font-size: 11.5px; font-weight: 600; opacity: .7; }
.ai-text { position: relative; z-index: 1; font-size: 21px; font-weight: 700; line-height: 1.4; letter-spacing: -.025em; margin: 10px 0 14px; text-wrap: pretty; max-width: 820px; }
.ai-meta { display: flex; gap: 26px; flex-wrap: wrap; position: relative; z-index: 1; }
.ai-meta div { display: grid; gap: 1px; } .ai-meta span { font-size: 11px; opacity: .6; } .ai-meta b { font-size: 13px; }
.anom { position: relative; z-index: 1; margin-top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: rgba(255,255,255,.06); }
.anom-l { display: flex; gap: 12px; align-items: center; min-width: 0; }
.anom-l b { padding: 3px 10px; border-radius: 99px; font-size: 12px; white-space: nowrap; }
.anom.good b { background: rgba(79,220,155,.2); color: #6ff0b3; } .anom.bad b { background: rgba(242,193,78,.22); color: #ffd36e; }
.anom-l span { font-size: 12.5px; opacity: .85; }
.anom-k { font-size: 11px; opacity: .55; white-space: nowrap; }

/* ---------- 게이지 · 액추에이터 ---------- */
.c-gauge { display: flex; flex-direction: column; align-items: center; }
.c-gauge .card-h { align-self: stretch; }
.gauge { position: relative; margin: -6px auto 0; }
.g-num { font: 800 50px var(--mono); letter-spacing: -.04em; }
.g-status { text-align: center; margin-top: -18px; }
.g-status .badge { font-size: 13px; padding: 5px 12px; }
.act { position: relative; padding: 14px; border-radius: 14px; background: var(--surface2); border: 1px solid transparent; }
.act-dot { position: absolute; top: 14px; right: 14px; width: 9px; height: 9px; border-radius: 9px; background: var(--line2); }
.act.on { border-color: color-mix(in oklab, var(--mint) 45%, transparent); }
.act.on .act-dot { background: var(--mint); box-shadow: 0 0 0 4px color-mix(in oklab, var(--mint) 20%, transparent); }
.act.on.t-danger { border-color: color-mix(in oklab, var(--danger) 50%, transparent); } .act.on.t-danger .act-dot { background: var(--danger); box-shadow: 0 0 0 4px color-mix(in oklab, var(--danger) 20%, transparent); }
.act-l { font-size: 12px; color: var(--muted); }
.act-v { font-size: 17px; font-weight: 800; margin: 2px 0; letter-spacing: -.02em; }
.act.on .act-v { color: var(--mint); } .act.on.t-danger .act-v { color: var(--danger); }
.act-h { font: 500 10.5px var(--mono); color: var(--muted); }
.conn { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.conn > svg { color: var(--ok); flex: none; } .conn.off > svg { color: var(--danger); }
.conn b { display: block; font-size: 13.5px; } .conn span { display: block; font-size: 11.5px; color: var(--muted); }
.conn.off { border-color: color-mix(in oklab, var(--danger) 50%, transparent); } .conn.off b { color: var(--danger); }
.conn-r { margin-left: auto; text-align: right; }
.conn-r b { font-size: 14px; }
.mini { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px 16px; display: grid; gap: 2px; box-shadow: var(--shadow); }
.mini:hover { border-color: var(--mint); }
.mini span { font-size: 12px; color: var(--muted); } .mini b { font: 700 24px var(--mono); letter-spacing: -.03em; } .mini small { font: 500 12px var(--sans); color: var(--muted); margin-left: 3px; }
.mini em { font-style: normal; font-size: 11.5px; color: var(--mint); font-weight: 600; }

/* ---------- 로그 ---------- */
.log { list-style: none; margin: 0; padding: 0; display: grid; }
.log li { display: grid; grid-template-columns: 44px 44px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; align-items: baseline; }
.log li:first-child { border-top: 0; }
.log-t { color: var(--muted); font-size: 11.5px; }
.log-k { font-size: 11px; font-weight: 700; padding: 1px 0; border-radius: 6px; text-align: center; background: var(--surface2); color: var(--muted); }
.log .lv-warn .log-k { color: var(--warn); } .log .lv-danger .log-k { color: var(--danger); } .log .lv-ok .log-k { color: var(--ok); } .log .lv-info .log-k { color: var(--info); }
.log-x { text-wrap: pretty; }

/* ---------- 기록 ---------- */
.evs { list-style: none; margin: 0; padding: 0; }
.evs li { display: grid; grid-template-columns: 76px 1fr 1fr 70px; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.evs li:first-child { border-top: 0; }
.evs li b { text-align: right; }
.evs.live { margin-bottom: 8px; padding: 2px 12px; border-radius: 12px; background: color-mix(in oklab, var(--mint) 10%, transparent); }
.ev-d { font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 7px; text-align: center; }
.d-gh { background: color-mix(in oklab, var(--c-gh) 18%, transparent); color: var(--c-gh); }
.d-mu { background: color-mix(in oklab, var(--c-mu) 18%, transparent); color: var(--c-mu); }
.d-bc { background: color-mix(in oklab, var(--c-bc) 22%, transparent); color: var(--c-bc); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 600; padding: 6px 0; }
.tbl td { padding: 8px 0; border-top: 1px solid var(--line); }
.tbl td:last-child { display: flex; gap: 8px; align-items: center; }
.minibar { width: 90px; height: 6px; border-radius: 6px; background: var(--surface2); overflow: hidden; } .minibar i { display: block; height: 100%; background: var(--ok); }

/* ---------- 라우팅 ---------- */
.flow { display: grid; grid-template-columns: 110px 70px 1fr; align-items: stretch; gap: 0; }
.flow-src { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 14px 8px; border-radius: 16px; background: var(--surface2); }
.flow-src span { font-size: 12px; color: var(--muted); font-weight: 600; }
.flow-src b { font-size: 18px; } .flow-src small { font-size: 11px; color: var(--muted); }
.tankv { width: 46px; height: 120px; border-radius: 12px; border: 2px solid var(--line2); position: relative; overflow: hidden; }
.tankv i { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(var(--mint), color-mix(in oklab, var(--mint) 55%, var(--deep))); transition: height .5s; }
.flow-lines { display: grid; grid-template-rows: repeat(3, 1fr); gap: 12px; }
.fl { position: relative; display: flex; align-items: center; justify-content: center; }
.fl i { position: absolute; left: 0; right: 0; top: 50%; height: 3px; background: var(--line2); border-radius: 3px; overflow: hidden; }
.fl span { position: relative; z-index: 1; font-size: 10px; color: var(--muted); background: var(--surface); padding: 1px 5px; border-radius: 6px; transform: translateY(-12px); }
.fl.on i { background: repeating-linear-gradient(90deg, var(--lc) 0 10px, transparent 10px 18px); background-size: 36px 3px; animation: flowx .6s linear infinite; }
.fl-gh { --lc: var(--c-gh); } .fl-mu { --lc: var(--c-mu); } .fl-bc { --lc: var(--c-bc); }
.fl.on span { color: var(--lc); }
@keyframes flowx { to { background-position: 36px 0; } }
.flow-dst { display: grid; grid-template-rows: repeat(3, 1fr); gap: 12px; }
.dest { padding: 14px 16px; border-radius: 16px; background: var(--surface2); border: 1px solid transparent; display: grid; gap: 8px; transition: border-color .3s; }
.dest.flowing { border-color: color-mix(in oklab, var(--mint) 45%, transparent); }
.dest-h { display: flex; align-items: center; gap: 10px; }
.dest-h > div { flex: 1; min-width: 0; } .dest-h b { display: block; font-size: 14.5px; } .dest-h span { display: block; font-size: 11.5px; color: var(--muted); }
.dest-n { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--surface); font-weight: 700; font-size: 12px; color: var(--mint); flex: none; }
.dest-v { display: flex; align-items: baseline; gap: 6px; } .dest-v b { font-size: 26px; font-weight: 700; letter-spacing: -.03em; } .dest-v > span { color: var(--muted); font-size: 12px; margin-right: auto; }
.dest-f { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); } .dest-f b { color: var(--text); }
.rangebar { position: relative; height: 8px; border-radius: 8px; background: var(--surface); }
.rangebar.sm { height: 6px; flex: 1; }
.rangebar .band { position: absolute; top: 0; bottom: 0; background: color-mix(in oklab, var(--ok) 40%, transparent); border-radius: 8px; }
.rangebar .cur { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 14px; background: var(--text); border: 3px solid var(--surface2); transform: translate(-50%, -50%); transition: left .4s; }
.rangebar .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ok); }
.dest-bc { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.dest-bc span { font-size: 11.5px; color: var(--muted); display: block; } .dest-bc b { font-size: 18px; }
.dest-note { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); }
.stack { display: flex; height: 38px; border-radius: 12px; overflow: hidden; background: var(--surface2); margin-bottom: 10px; }
.stack i { display: flex; align-items: center; padding: 0 10px; color: #06231a; font-style: normal; font-size: 12px; font-weight: 800; white-space: nowrap; overflow: hidden; transition: width .5s; }
.soils { display: grid; gap: 12px; }
.soil { padding: 12px 14px; border-radius: 14px; background: var(--surface2); display: grid; gap: 8px; }
.soil-h { display: flex; justify-content: space-between; align-items: center; } .soil-h b { font-size: 13.5px; }
.soil-m { display: flex; align-items: center; gap: 10px; font-size: 12px; } .soil-m > span { width: 50px; color: var(--muted); } .soil-m > b { width: 48px; text-align: right; font-size: 12.5px; }

/* ---------- 임팩트 ---------- */
.impact-wrap { display: grid; grid-template-columns: minmax(280px, 420px) 1fr; gap: 16px; align-items: start; }
.impact-prev { border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line); }

.calc { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.calc .op { font-size: 20px; color: var(--muted); }
.calc .res { background: color-mix(in oklab, var(--mint) 18%, transparent) !important; } .calc .res b { color: var(--mint); }

/* ---------- 알림 ---------- */

.al-b { flex: 1; display: grid; gap: 4px; justify-items: start; } .al-h { display: flex; justify-content: space-between; width: 100%; } .al-h span { font-size: 11.5px; color: var(--muted); } .al p { font-size: 13px; color: var(--muted); }

.set-row > div:first-child b { display: block; font-size: 13.5px; } .set-row > div:first-child span { display: block; font-size: 11.5px; color: var(--muted); }

.manual.dim .set-row { opacity: .6; }
.fb { display: flex; gap: 6px; } .fb input { flex: 1; min-width: 0; height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line2); background: var(--surface2); font-size: 12px; font-family: var(--mono); }

/* ---------- 소개 ---------- */
.hero { padding: 30px 28px; border-radius: 22px; background: var(--deep); color: #eafff6; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -80px; bottom: -120px; width: 320px; height: 320px; border-radius: 50%; border: 36px solid rgba(94,234,190,.14); }

.hero h2 { font-size: 30px; line-height: 1.3; font-weight: 800; letter-spacing: -.035em; margin: 10px 0 12px; position: relative; z-index: 1; }
.hero p { max-width: 620px; opacity: .8; font-size: 14.5px; position: relative; z-index: 1; text-wrap: pretty; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.fact .fact-n { font-size: 44px; font-weight: 800; color: var(--mint); letter-spacing: -.04em; display: block; line-height: 1.1; } .fact .fact-n small { font-size: 20px; }
.fact span { font-size: 13px; color: var(--muted); }
.about-loop { display: grid; place-items: center; padding: 8px 0 18px; }
.hw > div { padding: 12px 14px; border-radius: 12px; background: var(--surface2); } .hw span { font-size: 10.5px; color: var(--muted); letter-spacing: .06em; display: block; } .hw b { font-size: 13px; }
.road { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; counter-reset: r; }
.road li { position: relative; padding: 16px; border-radius: 14px; background: var(--surface2); display: grid; gap: 8px; }
.road li:not(:last-child)::after { content: "→"; position: absolute; right: -11px; top: 18px; color: var(--mint); font-weight: 800; z-index: 1; }
.road li > span { font-size: 11px; color: var(--mint); font-weight: 700; } .road b { font-size: 20px; letter-spacing: -.03em; } .road p { font-size: 12.5px; color: var(--muted); margin: 3px 0 6px; } .road em { font-style: normal; font-size: 11px; }
.sites { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 8px; }
.sites li { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 12px; background: var(--surface2); } .sites li b { flex: 1; font-size: 13.5px; } .sites svg { color: var(--mint); }
.btn.add { width: 100%; border-style: dashed; background: transparent; color: var(--mint); }

/* ---------- 순환 흐름도 ---------- */
.loop { position: relative; margin: 0 auto; }
.loop-run { animation: run 6s linear infinite; transform-origin: 170px 170px; }
@keyframes run { to { stroke-dashoffset: -804; } }
.loop-lbl { position: absolute; display: grid; white-space: nowrap; transition: opacity .5s; }
.loop-lbl b { font-size: 13px; font-weight: 700; } .loop-lbl span { font: 500 10.5px var(--mono); color: var(--muted); }

/* ---------- 스플래시 ---------- */
.splash { min-height: 100vh; display: grid; place-items: center; padding: 30px 20px; background: radial-gradient(ellipse at 50% 30%, color-mix(in oklab, var(--mint) 12%, var(--bg)), var(--bg) 65%); }

/* ---------- 시연 패널 · 토스트 ---------- */

.demo-h { display: flex; align-items: center; gap: 8px; } .demo-h b { font-size: 15px; } .demo-h span { font-size: 11px; color: var(--muted); margin-right: auto; } .demo-h .icon-btn { width: 30px; height: 30px; }

.demo-b { --c: var(--info); display: flex; align-items: center; gap: 12px; text-align: left; padding: 11px 13px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface2); }
.demo-b:hover { border-color: var(--c); } .demo-b.t-danger { --c: var(--danger); } .demo-b.t-warn { --c: var(--warn); } .demo-b.t-ok { --c: var(--mint); }

.demo-b svg { color: var(--c); }
.toasts { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; width: min(440px, calc(100vw - 24px)); }
.toast { display: flex; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line2); box-shadow: 0 14px 40px rgba(0,0,0,.35); animation: drop .3s ease; cursor: pointer; }
.toast b { font-size: 13.5px; } .toast p { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.toast.lv-danger { border-color: color-mix(in oklab, var(--danger) 60%, transparent); }
@keyframes drop { from { opacity: 0; transform: translateY(-10px); } }

/* ---------- 반응형 (모바일 우선 PWA) ---------- */
@media (max-width: 1100px) { .grid-home { grid-template-columns: 1fr 1fr; } .impact-wrap { grid-template-columns: 1fr 1fr; } }

  .tabbar button.on { color: var(--mint); }

<div id="root"></div>
<script>/* Recharts 2.x의 React 18.3 defaultProps 경고만 숨김 */(function(){const o=console.error;console.error=function(...a){if(typeof a[0]==='string'&&a[0].includes('defaultProps'))return;o.apply(console,a);};})();</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script>
/* ============================================================
   Carbon Loop — Core Engine
   - DataSource 인터페이스: SimulatorSource / FirebaseSource
   - Engine: AI 자동 제어 · 이상탐지 · 멀티 라우팅 · 토양 공급 판단
   (Vite+TS 프로젝트의 src/core/* 와 1:1 대응)
   ============================================================ */
(function () {
  // ---------- 상수 (가정값은 모두 여기로 분리) ----------
  const CONST = {
    PINE_KG_PER_YEAR: 6.6,          // 소나무 1그루 연간 흡수량(kg)
    PINE_G_PER_DAY: 18,             // 6.6kg / 365일 ≈ 18g
    AMBIENT: 420,                   // 외기 CO2 (ppm)
    GH_G_TO_PPM: 28,                // 온실 20m³ 기준 CO2 1g ≈ 28ppm
    MU_G_TO_PPM: 278,               // 버섯 챔버 2m³ 기준 CO2 1g ≈ 278ppm
    TANK_CAP: 150,                  // 포집 저장 탱크 용량 (g)
    TANK_RESERVE: 40,               // 온실·버섯용 예비량 (g) — 생체탄으로 보내지 않음
    PUMP_MAX: 2.0,                  // 분배 매니폴드 최대 유량 (g/분)
    GH_RATE: 2.0, MU_RATE: 1.5, BC_RATE: 1.5, // 라인별 정격 유량 (g/분)
    AMEND_KG_PER_G: 0.006,          // 고정 CO2 1g당 토양개량제 생산량(kg)
    SOC_PER_KG: 0.06,               // 개량제 1kg 투입 시 토양 유기탄소 지수 상승(%p)
    TICK_MS: 500,                   // 시뮬레이터 송신 주기(실시간)
    SERIES_BUCKET_MS: 5 * 60 * 1000 // 기록 그래프 5분 평균
  };

  const DEFAULT_SETTINGS = {
    mode: 'auto', demo: true, speed: 10, dark: true,
    low: 800, high: 1200, danger: 1500, targetMin: 900, targetMax: 1100,
    muMin: 3000, muMax: 5000,
    anomalyN: 20, anomalyK: 3.5,
    soilMin: 30, soilMax: 60, socTarget: 2.4,
    firebaseUrl: '', deviceId: 'campus-01', browserNotify: false
  };

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const gauss = (x, m, s) => Math.exp(-((x - m) ** 2) / (2 * s * s));
  const randn = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const hourOf = ts => { const d = new Date(ts); return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600; };
  const pad = n => String(n).padStart(2, '0');
  const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const hms = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
  const f0 = n => Math.round(n).toLocaleString('ko-KR');
  const f1 = n => (Math.round(n * 10) / 10).toLocaleString('ko-KR');
  const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
  const stdev = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); };
  const median = a => { const b = [...a].sort((x, y) => x - y); const k = b.length >> 1; return b.length % 2 ? b[k] : (b[k - 1] + b[k]) / 2; };

  /* ============================================================
     SimulatorSource — ESP32와 동일한 JSON 패킷을 흉내 냄
     ============================================================ */
  class SimulatorSource {
    constructor(deviceId) {
      this.kind = 'simulator';
      this.label = '시뮬레이터';
      this.deviceId = deviceId || 'campus-01';
      this.speed = 10; this.t = Date.now(); this.seq = 0; this.timer = null;
      this.cmd = { ghValve: false, muValve: false, bcValve: false, fan: false };
      this.s = {
        gh: 960, temp: 22, hum: 64, mu: 3500, tank: 70, walk: 0,
        bcFixed: 0, bcStock: 1.2, supplied: 0,
        soil: [
          { id: 'bed', name: '학내 화단', moisture: 46, soc: 2.2, dry: 0.012, water: 14 },
          { id: 'roof', name: '옥상정원', moisture: 40, soc: 1.95, dry: 0.02, water: 22 }
        ]
      };
      this.scn = { danger: 0, fault: 0, stuckVal: null, disconnect: 0, surge: 0 };
      this.acc = { prod: 0, gh: 0, mu: 0, bc: 0, vent: 0 };
    }
    start(cb) { this.cb = cb; this.stop(); this.timer = setInterval(() => this.tick(), CONST.TICK_MS); }
    stop() { if (this.timer) clearInterval(this.timer); this.timer = null; }
    isRunning() { return !!this.timer; }
    sendCommand(c) {
      if (c.soilSupply) {
        const { site, kg } = c.soilSupply;
        const s = this.s.soil.find(x => x.id === site);
        if (s) { const k = Math.min(kg, this.s.bcStock); this.s.bcStock -= k; s.soc += k * CONST.SOC_PER_KG; this.s.supplied += k; }
      }
      ['ghValve', 'muValve', 'bcValve', 'fan'].forEach(k => { if (k in c) this.cmd[k] = !!c[k]; });
    }
    trigger(name) {
      const s = this.s, sc = this.scn;
      if (name === 'danger') { sc.danger = 16; s.gh = Math.max(s.gh, 1000); }
      if (name === 'fault') { sc.fault = 30; sc.stuckVal = null; }
      if (name === 'disconnect') sc.disconnect = Math.ceil(12000 / CONST.TICK_MS);
      if (name === 'surge') { s.gh = Math.min(s.gh, 770); s.mu = Math.min(s.mu, 2750); s.tank = Math.max(s.tank, 100); sc.surge = 140; }
      if (name === 'reset') { sc.danger = sc.fault = sc.disconnect = sc.surge = 0; s.gh = 1000; s.mu = Math.max(s.mu, 3400); }
    }
    step(dt) {
      const s = this.s, c = this.cmd, h = hourOf(this.t);
      const light = Math.max(0, Math.sin(Math.PI * (h - 6) / 12));
      // 1) 음식물 발효 CO2 생성 (점심·저녁 배출 피크 + 랜덤워크)
      s.walk = clamp(s.walk + randn() * 0.02 * Math.sqrt(dt), -0.25, 0.25);
      let prod = (0.22 + 0.34 * gauss(h, 13.5, 2.2) + 0.3 * gauss(h, 19.5, 2.2)) * (1 + s.walk) * Math.sqrt(s.temp / 22);
      if (this.scn.surge > 0) prod += 1.2;
      prod = Math.max(0, prod) * dt;
      s.tank += prod; this.acc.prod += prod;
      // 2) 매니폴드 분배 — 물리적 우선순위 온실 → 버섯 → 생체탄
      let pump = CONST.PUMP_MAX * dt;
      const take = want => { const g = Math.max(0, Math.min(want, s.tank, pump)); s.tank -= g; pump -= g; return g; };
      const gh = c.ghValve ? take(CONST.GH_RATE * dt) : 0;
      const mu = c.muValve ? take(CONST.MU_RATE * dt) : 0;
      const bc = c.bcValve ? take(CONST.BC_RATE * dt) : 0;
      if (s.tank > CONST.TANK_CAP) { this.acc.vent += s.tank - CONST.TANK_CAP; s.tank = CONST.TANK_CAP; }
      this.acc.gh += gh; this.acc.mu += mu; this.acc.bc += bc;
      // 3) 온실: 광합성 흡수 · 호흡 · 누기 · 환기 · 주입
      const photo = 15 * light * clamp((s.gh - 250) / 800, 0, 1.5);
      const resp = 2.2 * (1 - light) + 0.4;
      const leak = (s.gh - CONST.AMBIENT) * 0.004;
      const vent = c.fan ? (s.gh - CONST.AMBIENT) * 0.15 : 0;
      s.gh = Math.max(CONST.AMBIENT, s.gh + (resp - photo - leak - vent) * dt + gh * CONST.GH_G_TO_PPM);
      const tT = 19.5 + 6 * Math.sin(2 * Math.PI * (h - 9) / 24) - (c.fan ? 1.5 : 0);
      const tH = 66 - 9 * Math.sin(2 * Math.PI * (h - 9) / 24) - (c.fan ? 8 : 0);
      const a = Math.min(1, 0.06 * dt);
      s.temp += (tT - s.temp) * a + randn() * 0.02; s.hum += (tH - s.hum) * a + randn() * 0.05;

  /* ============================================================
     FirebaseSource — Realtime Database REST 스트리밍 (SDK 불필요)

      this.stop();

        const onData = e => { try { const d = JSON.parse(e.data); if (d && d.data && d.path === '/') cb(normalizePacket(d.data)); } catch (err) { this.error = String(err); } };

    isRunning() { return !!this.es; }

  function normalizePacket(p) {
    return {
      deviceId: p.deviceId, ts: p.ts && p.ts > 1e12 ? p.ts : Date.now(), seq: p.seq || 0,
      gh: { co2: +p.co2 || +(p.gh && p.gh.co2) || 0, temp: +p.temp || +(p.gh && p.gh.temp) || 0, hum: +p.hum || +(p.gh && p.gh.hum) || 0 },
      mu: { co2: +(p.mu && p.mu.co2) || 3500 },
      tank: { g: +(p.tank && p.tank.g) || 60 },
      prodG: +p.prodG || 0, flow: { gh: +(p.flow && p.flow.gh) || 0, mu: +(p.flow && p.flow.mu) || 0, bc: +(p.flow && p.flow.bc) || 0 }, ventG: 0,

      soil: p.soil || [{ id: 'bed', name: '학내 화단', moisture: +p.soilMoisture || 45, soc: 2.2 }],

<script>
/* cl-live.jsx (JSX 미리 변환됨) */
/* Carbon Loop — 실물 연결 화면 (ESP32 → 구글 시트(Apps Script) → 이 화면)
   - 시뮬레이터(데모 모드)와 완전히 분리되어 있어요. 이 화면은 실제 장치 데이터만 보여줘요.
   - 판단은 ESP32(안전 규칙)와 Gemini(5분마다)가 하고, 이 화면은 결과와 이유를 보여주기만 해요. */

// Apps Script 웹앱 주소를 여기에 넣으면 기본값이 돼요. (화면 아래 '연결 설정'에서 바꿔도 됨)
const CL_LIVE_URL = '';
const LIVE_POLL_MS = 5000; // 5초마다 새로고침
const DEVICE_STALE_S = 35; // ESP32는 10초마다 보냄 → 35초 넘게 없으면 끊김
const GH_TARGET = [900, 1100];
function liveUrl() {
  try {
    return localStorage.getItem('cl.liveUrl') || CL_LIVE_URL;
  } catch (e) {
    return CL_LIVE_URL;
  }
}

/* ---------- 예시 데이터 (화면 미리보기 전용, 실측 아님) ---------- */
function makePreview() {
  const now = Date.now(),
    rows = [];
  let g = 640,
    c = 520,
    green = true,
    mode = 'RULE',
    lo = 800,
    hi = 1200,
    gp = 100,
    gMs = 0,
    cMs = 0;
  for (let i = 0; i < 360; i++) {
    const ts = now - (359 - i) * 10000;
    if (i === 60) mode = 'AI';
    if (mode === 'AI') {
      lo = 850;
      hi = 1120;
    }
    let ev = '';
    if (green) g += 6 + Math.random() * 3;else g -= 3 + Math.random() * 2;
    if (!green) c += 14 + Math.random() * 6;else c -= 1;
    c = Math.max(450, Math.min(5000, c));
    if (green && g > hi) {
      green = false;
      ev = mode === 'AI' ? 'AI_TO_CHAMBER' : 'TO_CHAMBER';
    } else if (!green && g < lo) {
      green = true;
      ev = mode === 'AI' ? 'AI_TO_GREEN' : 'TO_GREEN';
    }
    if (green) gMs += 10;else cMs += 10;
    gp = Math.round(gMs / (gMs + cMs) * 100);
    rows.push({
      ts,
      t: i * 10,
      g: Math.round(g + (Math.random() - .5) * 20),
      ga: Math.round(g),
      c: Math.round(c + (Math.random() - .5) * 30),
      ca: Math.round(c),
      route: green ? 'GREEN' : 'CHAMBER',
      fan: 0,
      gp,
      tc: 23.4,
      h: 51,
      ev,
      mode,
      lo,
      hi
    });
  }
  const aiLog = [{
    ts: now - 40000,
    valid: true,
    route: 'GREEN',
    lo: 850,
    hi: 1120,
    reason: '온실 평균 980ppm, 분당 +28ppm로 오르는 중이라 목표 안에서 온실 공급을 이어가요. 1,120 넘으면 챔버로 돌려요.',
    alert: ''
  }, {
    ts: now - 340000,
    valid: true,
    route: 'CHAMBER',

function useLiveData(url, preview) {
  const [st, setSt] = useState({
    data: null,
    err: '',
    lastOk: 0,
    loading: false
  });
  const busy = useRef(false);

    if (preview) {
      setSt({
        data: makePreview(),
        err: '',
        lastOk: Date.now(),
        loading: false
      });
      return;
    }
    if (!url) {
      setSt({
        data: null,
        err: '',
        lastOk: 0,
        loading: false
      });
      return;
    }
    let alive = true;
    const pull = async () => {
      if (busy.current) return;
      busy.current = true;
      try {
        const res = await fetch(url + (url.includes('?') ? '&' : '?') + 'n=360&_=' + Date.now());

        if (!alive) return;
        if (!j.ok) throw new Error(j.error || '서버 오류');

          data: j,
          err: '',
          lastOk: Date.now(),
          loading: false
        });
      } catch (e) {
        if (alive) setSt(s => ({
          ...s,
          err: String(e.message || e),
          loading: false
        }));
      } finally {
        busy.current = false;
      }
    };
    setSt(s => ({
      ...s,
      loading: true
    }));
    pull();
    const t = setInterval(pull, LIVE_POLL_MS);
    return () => {
      alive = false;
      clearInterval(t);
    };
  }, [url, preview]);
  return st;
}
